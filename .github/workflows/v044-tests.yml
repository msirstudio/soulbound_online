name: SOULBOUND v0.44 regression
on:
  push:
    branches: [v0.44-loot-inventory-index-hud]
  pull_request:
    branches: [v0.43-miniboss-art]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Validate JavaScript syntax
        run: |
          node --check server.js
          node --check loot-v034.js
          node --check world-v040.js
          node --check public/game.js
          node --check public/equipment-inventory-v032.js
          node --check public/adventure-index-v035.js
          node --check public/ui-foundation-v041.js
      - name: Run unit and regression tests
        run: npm test
