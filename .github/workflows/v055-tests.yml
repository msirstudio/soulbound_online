name: SOULBOUND v0.55 Hardcore Combat and Codex
on:
  push:
    branches: [v0.55-hardcore-combat-codex]
  pull_request:
    branches: [v0.54-full-combat-expansion]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Verify code syntax
        run: |
          node --check server.js
          node --check combat-v054.js
          node --check combat-v055.js
          node --check public/game.js
          node --check public/adventure-index-v035.js
          node --check public/update-log-v045.js
      - name: Run legacy and Hardcore combat tests
        run: npm test
