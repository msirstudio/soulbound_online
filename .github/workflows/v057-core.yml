name: SOULBOUND 0.57 Core Security and Save Regression
on:
  push:
    branches: [v0.57-core-hardening]
  pull_request:
    branches: [v0.56.4-system-foundation]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: node --check server.js && node --check public/game.js && node --check persistence/secure-saves-v057.js
      - run: npm test
      - run: npm run audit:secure
