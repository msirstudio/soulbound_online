name: SOULBOUND v0.45 regression
on:
  push:
    branches: [v0.45-independent-loot-changelog]
  pull_request:
    branches: [v0.44-loot-inventory-index-hud]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Validate JavaScript syntax
        run: |
          node --check server.js
          node --check loot-v034.js
          node --check public/game.js
          node --check public/adventure-index-v035.js
          node --check public/update-log-v045.js
      - name: Run regression tests
        run: npm test
