name: SOULBOUND 0.60 Expanded Weapon Shop
on:
  push:
    branches: [v0.60-expanded-weapon-shop]
  pull_request:
    branches: [v0.59-multiplayer-stability]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: node --check server.js && node --check public/game.js && node --check items/weapon-shop-v060.js
      - run: npm test
      - run: npm run audit:weapons
