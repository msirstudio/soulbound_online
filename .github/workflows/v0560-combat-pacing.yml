name: SOULBOUND v0.56.0 combat animation pacing
on:
  push:
    branches: [v0.56.0-combat-pacing-animation]
  pull_request:
    branches: [v0.55.9-header-audio-special-only]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: node --check server.js && node --check public/game.js && node --check public/sprite-animation-v0311.js
      - run: npm test
