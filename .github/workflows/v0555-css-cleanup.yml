name: SOULBOUND v0.55.5 CSS cleanup checks
on:
  push:
    branches: [v0.55.5-css-consolidation]
  pull_request:
    branches: [v0.55.4-swordsman-pose-art]
permissions:
  contents: read
jobs:
  css-and-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install game dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Verify CSS bundles and load order
        run: node --test tests/v0555-css-bundles.test.js
      - name: Verify syntax and existing tests
        run: |
          node --check public/game.js
          node --check public/sprite-animation-v0311.js
          node --check public/adventure-index-v0552.js
          npm test
