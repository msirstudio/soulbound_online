name: SOULBOUND v0.48.4 Audio and Mini Bosses
on:
  push:
    branches: [v0.48.4-audio-mini-camp-boss-tags]
  pull_request:
    branches: [v0.48.3-camp-merchant-log-ui]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Validate JavaScript
        run: |
          node --check server.js
          node --check public/game.js
          node --check public/world-ui-v040.js
          node --check tests/v0484.test.js
      - name: Run all regression tests
        run: npm test
