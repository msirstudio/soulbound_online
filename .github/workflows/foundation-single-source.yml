name: SOULBOUND Foundation & Single Source
on:
  push:
    branches: [v0.62-foundation-single-source]
  pull_request:
    branches: [v0.62-female-knight-idle-12fps]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Syntax check extracted code and original runtime
        run: |
          node --check server.js
          node --check public/game.js
          node --check public/skill-view-v062.js
          node --check public/adventure-index-v0552.js
          node --check api/adventure-index-v062.js
          node --check data/game-catalog-v062.js
          node --check combat/public-skill-catalog-v062.js
      - name: Run all regressions and canonical parity tests
        run: npm test
