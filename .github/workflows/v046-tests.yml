name: SOULBOUND v0.46 World Atlas checks
on:
  push:
    branches: [v0.46-organic-world-atlas]
  pull_request:
    branches: [v0.45-independent-loot-changelog]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Check game JavaScript
        run: |
          node --check server.js
          node --check public/world-ui-v040.js
          node --check public/update-log-v045.js
          node --check public/game.js
      - name: Run all gameplay and UI tests
        run: npm test
      - name: Verify generated world map PNG
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import struct
          p=Path("public/assets/world/world-map-v046.png")
          assert p.is_file(), "Upload world-map-v046.png to this branch before deploying."
          with p.open("rb") as f: data=f.read(24)
          assert data[:8] == b"\\x89PNG\\r\\n\\x1a\\n", "Map must be a PNG, not SVG."
          assert struct.unpack(">II",data[16:24]) == (1448,1086), "Incorrect map dimensions."
          print("Generated pixel-art PNG verified:",p)
          PY
