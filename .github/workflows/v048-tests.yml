name: SOULBOUND v0.48 City and Loot
on:
  push:
    branches: [v0.48-city-shops-loot-balance]
  pull_request:
    branches: [v0.47-interactive-capital]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Check JavaScript
        run: |
          node --check server.js
          node --check loot-v034.js
          node --check public/game.js
          node --check public/world-ui-v040.js
      - name: Run regression tests
        run: npm test
